name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Required to create a Release

jobs:
  # 1. Export the frontend static site once; reuse the artifact for each cross-compiled platform
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Stamp version from tag  # Inject the release tag into the frontend version; do not hard-code it
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # 2. Cross-compile five platforms with the embedded frontend and package ZIP archives
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BIN=antifox
          [ "$GOOS" = "windows" ] && BIN=antifox.exe
          # Embed the skill library (report-generation is generated by Go SeedSkillFiles, so exclude it)
          mkdir -p server/skillsdist && cp -r skills/. server/skillsdist/ && rm -rf server/skillsdist/report-generation
          go build -tags embedui -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$BIN" ./cmd/antifox
      - name: Package
        run: |
          NAME="antifox-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$NAME"
          cp -r skills "$NAME"/
          cp config.example.json "$NAME"/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp antifox.exe "$NAME"/
          else
            cp antifox "$NAME"/
            cp start.sh "$NAME"/                                  # Daemon start script required by the UI one-click update
            mkdir -p "$NAME/deploy" && cp deploy/antifox.service "$NAME/deploy"/  # systemd template
          fi
          zip -r "$NAME.zip" "$NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.zip"
      # Upload Linux binaries separately so the Docker job can reuse them without rebuilding the frontend and Go code
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: antifox

  # Ã¢â€˜Â¢ Summary zip Ã¢â€ â€™ Create GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Retrieve CHANGELOG.md for the release notes
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      # Checksum manifest: after a one-click update downloads a selfupdate package, it verifies its SHA256 against this file and refuses installation if it is absent.
      # The file name is the basename (sha256sum is generated inside dist/), and it matches selfupdate.AssetName exactly.
      - name: Generate SHA256SUMS
        run: cd dist && sha256sum *.zip > SHA256SUMS && cat SHA256SUMS
      # Keep the "This update" summary concise: use the topmost version section from CHANGELOG as the release body.
      - name: Extract release notes
        run: |
          awk '/^## /{n++} n==1{print}' CHANGELOG.md | tail -n +2 > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md

  # 4. Push multi-architecture images to GHCR, reusing the prebuilt Linux binaries
  #    The image contains only tools and binaries; arm64 needs only the emulated apt layer, making builds much faster.
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4 # Retrieve Dockerfile and skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/antifox-ai/antifox
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
