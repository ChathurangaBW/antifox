name: publish package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: 2.0.3

permissions:
  contents: read
  packages: write

jobs:
  # Same backend gate as release.yml: a manual publish is held to the same tests.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Publishes the linux/amd64 image only (see release.yml for platform support).
  publish-ghcr:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"
      - name: Build the embedded frontend
        working-directory: web
        run: |
          npm ci
          npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version
          NEXT_EXPORT=1 npm run build
      - name: Build the Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p server/webui/dist server/skillsdist dist/amd64
          cp -r web/out/. server/webui/dist/
          cp -r skills/. server/skillsdist/
          rm -rf server/skillsdist/report-generation
          go build -tags embedui -trimpath -ldflags "-s -w -X main.version=v${{ inputs.version }}" -o dist/amd64/antifox ./cmd/antifox
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          build-args: TARGETARCH=amd64
          # The source label is what links the GHCR package to this repository.
          labels: |
            org.opencontainers.image.source=https://github.com/ChathurangaBW/antifox
            org.opencontainers.image.description=AI autonomous penetration-testing platform
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.version=v${{ inputs.version }}
          tags: |
            ghcr.io/chathurangabw/antifox:v${{ inputs.version }}
            ghcr.io/chathurangabw/antifox:latest
