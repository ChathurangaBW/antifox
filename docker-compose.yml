services:
  postgres:
    # pgvector build of PostgreSQL 16: the knowledge base needs the vector
    # extension for semantic search; plain postgres silently falls back to keywords.
    # Upgrading an existing postgres:16-alpine volume: Alpine (musl) and this
    # Debian (glibc) image order text differently, so run REINDEX DATABASE once
    # after the switch to rebuild text indexes.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antifox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please. .env Settings POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-antifox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antifox} -d ${POSTGRES_DB:-antifox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  antifox:
    image: ghcr.io/chathurangabw/antifox:${ANTIFOX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTIFOX_PG_DSN: postgres://${POSTGRES_USER:-antifox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antifox}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTIFOX_LLM_PROVIDER: ${ANTIFOX_LLM_PROVIDER:-}
      ANTIFOX_LLM_MODEL: ${ANTIFOX_LLM_MODEL:-}
      ANTIFOX_LLM_BASE_URL: ${ANTIFOX_LLM_BASE_URL:-}
      ANTIFOX_LLM_PROXY: ${ANTIFOX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      # List of data jwt.key, SQLite It's bound to the root directory. data/,
      # It's easy to look directly at the host in the room./Backup, container reconstruction.
      - ./data:/app/data
      # The root of the project. skills Attached to container (cover mirror-enclosed) /app/skills);
      # Change skill There is no need to rebuild the mirror. The container reads the host.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
